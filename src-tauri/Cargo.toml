[package]
name = "rhine-archive"
version = "0.3.0"
description = "RHINE ARCHIVE - Offline PDF reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSResponder"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2"
