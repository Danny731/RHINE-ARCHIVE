[package]
name = "pagewise"
version = "0.2.2"
description = "An offline textbook reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
