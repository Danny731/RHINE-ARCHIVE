[package]
name = "pagewise"
version = "0.3.0"
description = "An offline textbook reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2"
